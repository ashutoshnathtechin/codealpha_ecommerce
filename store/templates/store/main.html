<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .box-element {
            box-shadow: hsl(0, 0%, 80%) 0 0 16px;
            background-color: #fff;
            border-radius: 4px;
            padding: 10px;
        }
        .thumbnail { width: 100%; height: 200px; object-fit: cover; }
        #cart-icon { width: 25px; display: inline-block; margin-left: 15px; }
        #cart-total { display: block; text-align: center; color: #fff; background-color: red; width: 20px; height: 25px; border-radius: 50%; font-size: 14px; }
    </style>
    <script type="text/javascript">
        var user = "{{ request.user }}";
        
        function getToken(name) {
            var cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                var cookies = document.cookie.split(";");
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        var csrftoken = getToken("csrftoken");
    </script>
    <style>
        .amazon-navbar {
            background-color: #131921;
            color: white;
            padding: 10px 20px;
        }
        .amazon-brand {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .amazon-brand span {
            color: #ff9900;
        }
        .amazon-brand:hover {
            color: white;
        }
        .amazon-search {
            flex-grow: 1;
            display: flex;
            margin: 0 20px;
        }
        .amazon-search input {
            width: 100%;
            padding: 8px 10px;
            border: none;
            border-radius: 4px 0 0 4px;
        }
        .amazon-search button {
            background-color: #febd69;
            border: none;
            padding: 8px 15px;
            border-radius: 0 4px 4px 0;
            color: #111;
            font-weight: bold;
        }
        .amazon-search button:hover {
            background-color: #f3a847;
        }
        .nav-link-custom {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .nav-link-custom span.line-1 {
            font-size: 12px;
            color: #ccc;
        }
        .nav-link-custom span.line-2 {
            font-weight: bold;
        }
        .nav-link-custom:hover {
            color: white;
            border: 1px solid white;
            padding: 0;
            margin: -1px 14px -1px 14px;
            border-radius: 2px;
        }
        .cart-container {
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }
        .cart-container:hover {
            color: white;
        }
        #cart-icon { width: 35px; }
        #cart-total { 
            color: #f08804; 
            font-weight: bold; 
            font-size: 16px; 
            margin-left: -20px;
            margin-top: -15px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <nav class="amazon-navbar d-flex align-items-center flex-wrap">
        <a class="amazon-brand" href="{% url 'store' %}">Amazone<span>.</span></a>
        
        <div class="amazon-search d-none d-md-flex">
            <input type="text" placeholder="Search Amazone">
            <button type="submit">🔍</button>
        </div>
        
        <div class="d-flex align-items-center ms-auto">
            {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}" class="nav-link-custom">
                    <span class="line-1">Hello, {{ request.user.username }}</span>
                    <span class="line-2">Sign Out</span>
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link-custom">
                    <span class="line-1">Hello, sign in</span>
                    <span class="line-2">Account & Lists</span>
                </a>
            {% endif %}
            
            <a href="{% url 'cart' %}" class="cart-container">
                <img id="cart-icon" src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" style="filter: invert(1);">
                <span id="cart-total">{{ order.get_cart_items|default:0 }}</span>
                <span>Cart</span>
            </a>
        </div>
    </nav>
    
    <div class="amazon-search d-flex d-md-none mt-2 px-2" style="width: 100%;">
        <input type="text" placeholder="Search Amazone">
        <button type="submit">🔍</button>
    </div>

    <div class="{% block container_class %}container mt-4{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var updateBtns = document.getElementsByClassName("update-cart")
        for(var i = 0; i < updateBtns.length; i++){
            updateBtns[i].addEventListener("click", function(){
                var productId = this.dataset.product
                var action = this.dataset.action
                
                if(user === "AnonymousUser"){
                    window.location.href = "{% url 'login' %}"
                }else{
                    updateUserOrder(productId, action)
                }
            })
        }
        
        function updateUserOrder(productId, action){
            var url = "/update_item/"
            
            fetch(url, {
                method: "POST",
                headers:{
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrftoken,
                }, 
                body:JSON.stringify({"productId": productId, "action":action})
            })
            .then((response) =>{
                return response.json()
            })
            .then((data) =>{
                location.reload()
            })
        }
    </script>
</body>
</html>
